# DesignThix – Development (Branch dev, Image :nightly) mit pgAdmin
#   docker compose -f docker-compose.dev.yml up -d
#   App:     http://localhost:3043
#   pgAdmin: http://localhost:3044   (ohne Anmeldung; Datenbank-Passwort: designthix)
name: designthix-dev

services:
  web:
    image: ghcr.io/real-ttx/designthix:nightly
    restart: unless-stopped
    ports:
      - "3043:3043"
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: designthix
      POSTGRES_USER: designthix
      POSTGRES_PASSWORD: designthix
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U designthix -d designthix"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "3044:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@designthix.example.com
      PGADMIN_DEFAULT_PASSWORD: designthix
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    configs:
      - source: servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

configs:
  servers:
    content: |
      {"Servers": {"1": {"Name": "DesignThix", "Group": "Servers", "Host": "db", "Port": 5432, "MaintenanceDB": "designthix", "Username": "designthix", "SSLMode": "prefer"}}}

volumes:
  web-data:
  db-data:
  pgadmin-data:
